name: Normalize Source & Lockfile

on:
  push:
    branches: [v16-repository-final]
    paths:
      - '.github/workflows/normalize-source.yml'
      - 'source/**'
      - 'scripts/prepare-web.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize readable application source
        shell: bash
        run: |
          if [ -f source/index.part01.b64 ]; then
            node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');
          const names = ['index.part01.b64','index.part02.b64','index.part03.b64','index.part04.b64'];
          const encoded = names.map(name => fs.readFileSync('source/' + name, 'utf8')).join('').replace(/\s+/g,'');
          const original = zlib.gunzipSync(Buffer.from(encoded, 'base64'));
          fs.writeFileSync('source/index.html', original);
          const reread = fs.readFileSync('source/index.html');
          if (!original.equals(reread)) throw new Error('source/index.html is not byte-identical to legacy payload');
          console.log('Readable source bytes:', reread.length);
          console.log('Readable source SHA-256:', crypto.createHash('sha256').update(reread).digest('hex'));
          NODE
          else
            test -s source/index.html
            echo "Readable source already normalized."
          fi

      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify source pipeline
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:web
          node --check www/mobile-modern.js
          npm run qa

      - name: Commit normalization outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/index.html package-lock.json
          for part in source/index.part01.b64 source/index.part02.b64 source/index.part03.b64 source/index.part04.b64; do
            if [ -f "$part" ]; then git rm "$part"; fi
          done
          if git diff --cached --quiet; then
            echo "Repository source and lockfile are already normalized."
            exit 0
          fi
          git commit -m "chore: finalize readable source and npm lockfile"
          git push origin HEAD:v16-repository-final
