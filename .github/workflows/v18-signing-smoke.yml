name: V18 Production Signing Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production-signing

    env:
      BP_DIARY_RELEASE_STORE_PASSWORD: ${{ secrets.BP_DIARY_RELEASE_STORE_PASSWORD }}
      BP_DIARY_RELEASE_KEY_ALIAS: ${{ secrets.BP_DIARY_RELEASE_KEY_ALIAS }}
      BP_DIARY_RELEASE_KEY_PASSWORD: ${{ secrets.BP_DIARY_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Load V18 metadata and pinned signer
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_ENV"
          const v=require('./version.json');
          if(v.release!=='V18'||v.versionName!=='5.8.0'||v.versionCode!==181) throw new Error('Unexpected V18 metadata');
          for(const [k,val] of Object.entries({
            APP_RELEASE:v.release,
            VERSION_NAME:v.versionName,
            VERSION_CODE:v.versionCode,
            ARTIFACT_BASE:v.artifactBase
          })) console.log(k+'='+val);
          NODE
          test -s ci/release-cert-v18.sha256
          CERT_FP="$(tr '[:upper:]' '[:lower:]' < ci/release-cert-v18.sha256 | tr -d ':[:space:]')"
          test "$(printf '%s' "$CERT_FP" | wc -c)" -eq 64
          echo "BP_DIARY_RELEASE_CERT_SHA256=$CERT_FP" >> "$GITHUB_ENV"

      - name: Validate protected signing inputs
        env:
          BP_DIARY_RELEASE_KEYSTORE_B64: ${{ secrets.BP_DIARY_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          test -n "$BP_DIARY_RELEASE_KEYSTORE_B64"
          test -n "$BP_DIARY_RELEASE_STORE_PASSWORD"
          test -n "$BP_DIARY_RELEASE_KEY_ALIAS"
          test -n "$BP_DIARY_RELEASE_KEY_PASSWORD"

      - name: Materialize and verify production keystore
        env:
          BP_DIARY_RELEASE_KEYSTORE_B64: ${{ secrets.BP_DIARY_RELEASE_KEYSTORE_B64 }}
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/bp-diary-release-v2.p12"
          printf '%s' "$BP_DIARY_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "BP_DIARY_RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

          keytool -list             -keystore "$KEYSTORE"             -storetype PKCS12             -storepass "$BP_DIARY_RELEASE_STORE_PASSWORD"             -alias "$BP_DIARY_RELEASE_KEY_ALIAS" >/dev/null

          keytool -exportcert             -keystore "$KEYSTORE"             -storetype PKCS12             -storepass "$BP_DIARY_RELEASE_STORE_PASSWORD"             -alias "$BP_DIARY_RELEASE_KEY_ALIAS"             -file "$RUNNER_TEMP/bp-diary-release-v2.cer" >/dev/null

          ACTUAL_FP="$(sha256sum "$RUNNER_TEMP/bp-diary-release-v2.cer" | awk '{print $1}')"
          test "$ACTUAL_FP" = "$BP_DIARY_RELEASE_CERT_SHA256"
          echo "Keystore certificate fingerprint verified: $ACTUAL_FP"

      - name: Reject tracked signing secrets
        run: npm run security:check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare and regression-test web app
        run: |
          npm run prepare:web
          node --check www/mobile-modern.js
          npm run qa

      - name: Create and patch Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          npx capacitor-assets generate --android --iconBackgroundColor '#126f96' --iconBackgroundColorDark '#08131f' --splashBackgroundColor '#eef6fa' --splashBackgroundColorDark '#08131f'

      - name: Configure V18 production signing
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='android/app/build.gradle';
          let g=fs.readFileSync(path,'utf8');
          if(g.includes('bpDiaryProduction')) throw new Error('Production signing already configured');
          g=g.replace(/android\s*\{/,m=>m+`
              signingConfigs {
                  bpDiaryProduction {
                      storeFile file(System.getenv("BP_DIARY_RELEASE_KEYSTORE_PATH"))
                      storePassword System.getenv("BP_DIARY_RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("BP_DIARY_RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("BP_DIARY_RELEASE_KEY_PASSWORD")
                      storeType "PKCS12"
                  }
              }
          `);
          g=g.replace(/release\s*\{/,m=>m+`
                      signingConfig signingConfigs.bpDiaryProduction
          `);
          fs.writeFileSync(path,g);
          NODE
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -q 'signingConfig signingConfigs.bpDiaryProduction' android/app/build.gradle

      - name: Build signed V18 candidate
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signed APK identity
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          APK_FP="$(grep -m1 'certificate SHA-256 digest' /tmp/apksigner.txt | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$APK_FP" = "$BP_DIARY_RELEASE_CERT_SHA256"
          cp "$APK" "${ARTIFACT_BASE}-Signed-Candidate.apk"
          sha256sum "${ARTIFACT_BASE}-Signed-Candidate.apk" > "${ARTIFACT_BASE}-Signed-Candidate.apk.sha256"

      - name: Upload signed candidate only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}-Signed-Candidate
          path: |
            ${{ env.ARTIFACT_BASE }}-Signed-Candidate.apk
            ${{ env.ARTIFACT_BASE }}-Signed-Candidate.apk.sha256
          if-no-files-found: error
          retention-days: 14
