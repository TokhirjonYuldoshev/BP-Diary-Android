name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare offline web assets
        run: npm run prepare:web

      - name: Validate HTML and mobile shell
        run: |
          test -s www/mobile-modern.css
          test -s www/mobile-modern.js
          grep -q 'mobile-modern.css' www/index.html
          grep -q 'mobile-modern.js' www/index.html
          grep -q 'mobileBottomNav' www/mobile-modern.js
          grep -q 'mobileArchiveCards' www/mobile-modern.js
          grep -q 'mobileMeasureHero' www/mobile-modern.js
          grep -q 'vendor/chart/chart.umd.js' www/index.html
          grep -q 'vendor/fontawesome/css/all.min.css' www/index.html
          grep -q 'vendor/xlsx/xlsx.full.min.js' www/index.html
          if grep -qE 'cdnjs.cloudflare.com|cdn.jsdelivr.net/npm/chart.js|cdn.sheetjs.com/xlsx-' www/index.html; then
            echo "External runtime CDN reference found"
            exit 1
          fi
          node --check www/mobile-modern.js

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android icon and splash resources
        run: npx capacitor-assets generate --android --iconBackgroundColor '#126f96' --iconBackgroundColorDark '#08131f' --splashBackgroundColor '#eef6fa' --splashBackgroundColorDark '#08131f'

      - name: Configure Android build version
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"5.5.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BP-Diary-5.5-WOW.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BP-Diary-5.5-WOW-Android-APK
          path: BP-Diary-5.5-WOW.apk
          if-no-files-found: error
          retention-days: 30
