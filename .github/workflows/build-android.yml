name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare offline web assets
        run: npm run prepare:web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android icon and splash resources
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1f4870' --iconBackgroundColorDark '#111827' --splashBackgroundColor '#eef2f7' --splashBackgroundColorDark '#0b1120'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BP-Diary-5.5-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BP-Diary-5.5-Android-APK
          path: BP-Diary-5.5-debug.apk
          if-no-files-found: error
          retention-days: 30
