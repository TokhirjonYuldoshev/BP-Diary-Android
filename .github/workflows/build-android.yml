name: Build Android APK

on:
  push:
    branches: [main, v11-ui-ux, v12-functional-upgrades, v13-ui-polish, v15-finalization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare offline web assets
        run: npm run prepare:web

      - name: Validate HTML and mobile shell
        run: |
          test -s www/mobile-modern.css
          test -s www/mobile-modern.js
          test -s www/vendor/pdf/html2canvas.min.js
          test -s www/vendor/pdf/jspdf.umd.min.js
          grep -q 'mobile-modern.css' www/index.html
          grep -q 'mobile-modern.js' www/index.html
          grep -q 'mobileBottomNav' www/mobile-modern.js
          grep -q 'mobileArchiveCards' www/mobile-modern.js
          grep -q 'mobileArchiveSearch' www/mobile-modern.js
          grep -q 'bp_archive_search_v15' www/mobile-modern.js
          grep -q 'applyAccessibility' www/mobile-modern.js
          grep -q 'mobileMeasureHero' www/mobile-modern.js
          grep -q 'sharePdfBase64' www/mobile-modern.js
          grep -q 'mobileToast' www/mobile-modern.js
          grep -q 'mobileConfirmSheet' www/mobile-modern.js
          grep -q 'mobile-report-actions' www/mobile-modern.js
          grep -q 'Android V15' www/mobile-modern.js
          grep -q 'mobile-cardio-row' www/mobile-modern.js
          grep -q 'mobile-target-shell' www/mobile-modern.js
          grep -q 'date-time-row.mobile-cardio-row' www/mobile-modern.css
          grep -q 'date-time-row.target-row.mobile-target-shell' www/mobile-modern.css
          grep -q 'vendor/pdf/html2canvas.min.js' www/index.html
          grep -q 'vendor/pdf/jspdf.umd.min.js' www/index.html
          grep -q 'vendor/chart/chart.umd.js' www/index.html
          grep -q 'vendor/fontawesome/css/all.min.css' www/index.html
          grep -q 'vendor/xlsx/xlsx.full.min.js' www/index.html
          if grep -qE 'cdnjs.cloudflare.com|cdn.jsdelivr.net/npm/chart.js|cdn.sheetjs.com/xlsx-' www/index.html; then
            echo "External runtime CDN reference found"
            exit 1
          fi
          node --check www/mobile-modern.js

      - name: Run V15 regression smoke
        run: npm run qa:v15

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android native features and signing
        run: |
          node scripts/patch-android.mjs
          grep -q 'OnBackPressedCallback' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/MainActivity.java
          grep -q 'sharePdfBase64' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'void openUrl' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android icon and splash resources
        run: npx capacitor-assets generate --android --iconBackgroundColor '#126f96' --iconBackgroundColorDark '#08131f' --splashBackgroundColor '#eef6fa' --splashBackgroundColorDark '#08131f'

      - name: Configure Android build version
        run: |
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"5.5.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Verify permanent signing key
        run: |
          keytool -list -keystore android/app/bp-diary-signing.p12 -storetype PKCS12 -storepass android -alias androiddebugkey >/dev/null
          echo "Signing key SHA-256:"
          keytool -exportcert -keystore android/app/bp-diary-signing.p12 -storetype PKCS12 -storepass android -alias androiddebugkey | sha256sum

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify debug and release APK signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          KEY_FP="$(keytool -exportcert -keystore android/app/bp-diary-signing.p12 -storetype PKCS12 -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          for APK in android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/release/app-release.apk; do
            test -s "$APK"
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signature.txt
            APK_FP="$(grep -m1 'certificate SHA-256 digest' /tmp/apk-signature.txt | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
            test -n "$APK_FP"
            test "$KEY_FP" = "$APK_FP"
          done
          echo "Verified permanent signer on debug and release APKs: $KEY_FP"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BP-Diary-5.5-V15.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BP-Diary-5.5-V15-Android-APK
          path: BP-Diary-5.5-V15.apk
          if-no-files-found: error
          retention-days: 30
