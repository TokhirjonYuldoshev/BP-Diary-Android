name: Build Android APK

on:
  # Run on every branch push so protected-main required checks can be
  # satisfied on the exact commit SHA before main is updated.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Load version metadata
        shell: bash
        run: |
          node -e "const v=require('./version.json'); for (const [k,val] of Object.entries({APP_RELEASE:v.release,VERSION_NAME:v.versionName,VERSION_CODE:v.versionCode,ARTIFACT_BASE:v.artifactBase})) console.log(k+'='+val)" >> "$GITHUB_ENV"

      - name: Reject tracked signing secrets
        run: npm run security:check

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify readable source layout
        run: |
          test -s source/index.html
          if ls source/index.part*.b64 >/dev/null 2>&1; then
            echo "Legacy Base64 source chunks must not exist"
            exit 1
          fi

      - name: Prepare offline web assets
        run: npm run prepare:web

      - name: Validate HTML and mobile shell
        run: |
          test -s www/mobile-modern.css
          test -s www/mobile-modern.js
          test -s www/vendor/pdf/html2canvas.min.js
          test -s www/vendor/pdf/jspdf.umd.min.js
          grep -q 'mobile-modern.css' www/index.html
          grep -q 'mobile-modern.js' www/index.html
          grep -q 'mobileBottomNav' www/mobile-modern.js
          grep -q 'mobileArchiveCards' www/mobile-modern.js
          grep -q 'mobileArchiveSearch' www/mobile-modern.js
          grep -q 'bp_archive_search_v15' www/mobile-modern.js
          grep -q 'applyAccessibility' www/mobile-modern.js
          grep -q 'mobileMeasureHero' www/mobile-modern.js
          grep -q 'sharePdfBase64' www/mobile-modern.js
          grep -q 'mobileToast' www/mobile-modern.js
          grep -q 'mobileConfirmSheet' www/mobile-modern.js
          grep -q 'mobile-report-actions' www/mobile-modern.js
          grep -q "const APP_RELEASE='${APP_RELEASE}'" www/mobile-modern.js
          grep -q 'mobile-cardio-row' www/mobile-modern.js
          grep -q 'mobile-target-shell' www/mobile-modern.js
          grep -q 'date-time-row.mobile-cardio-row' www/mobile-modern.css
          grep -q 'date-time-row.target-row.mobile-target-shell' www/mobile-modern.css
          grep -q 'vendor/pdf/html2canvas.min.js' www/index.html
          grep -q 'vendor/pdf/jspdf.umd.min.js' www/index.html
          grep -q 'vendor/chart/chart.umd.js' www/index.html
          grep -q 'vendor/fontawesome/css/all.min.css' www/index.html
          grep -q 'vendor/xlsx/xlsx.full.min.js' www/index.html
          if grep -qE 'cdnjs.cloudflare.com|cdn.jsdelivr.net/npm/chart.js|cdn.sheetjs.com/xlsx-' www/index.html; then
            echo "External runtime CDN reference found"
            exit 1
          fi
          node --check www/mobile-modern.js

      - name: Run regression smoke
        run: npm run qa

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android native features
        run: |
          node scripts/patch-android.mjs
          grep -q 'OnBackPressedCallback' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/MainActivity.java
          grep -q 'sharePdfBase64' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'void openUrl' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'void scheduleDailyReminder' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'void checkForUpdate' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'void getBiometricStatus' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'void authenticateBiometric' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'void setPrivacyShield' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/NativeBridgePlugin.java
          grep -q 'androidx.biometric:biometric' android/app/build.gradle
          grep -q 'class ReminderReceiver' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/ReminderReceiver.java
          grep -q 'class ReminderRestoreReceiver' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/ReminderRestoreReceiver.java
          grep -q 'class ReminderScheduler' android/app/src/main/java/com/tokhirjonyuldoshev/bpdiary/ReminderScheduler.java
          grep -q 'android:name=".ReminderReceiver"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:name=".ReminderRestoreReceiver"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:exported="true"' android/app/src/main/AndroidManifest.xml
          if grep -qE 'bpDiaryStable|bp-diary-signing|storePassword "android"|ci/debug\.keystore\.b64' android/app/build.gradle scripts/patch-android.mjs; then
            echo "Embedded legacy/production signing configuration found"
            exit 1
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android icon and splash resources
        run: npx capacitor-assets generate --android --iconBackgroundColor '#126f96' --iconBackgroundColorDark '#08131f' --splashBackgroundColor '#eef6fa' --splashBackgroundColorDark '#08131f'

      - name: Configure Android build version
        run: |
          sed -i "s/versionCode 1/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build debug and unsigned release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Verify CI signing boundary
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DEBUG_APK"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK" | tee /tmp/debug-signature.txt
          DEBUG_FP="$(grep -m1 'certificate SHA-256 digest' /tmp/debug-signature.txt | sed 's/.*digest: //' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test -n "$DEBUG_FP"
          echo "CI debug signer: $DEBUG_FP"

          RELEASE_APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          echo "Unsigned release build produced: $RELEASE_APK"

      - name: Prepare V18 debug candidate
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "${ARTIFACT_BASE}-Debug-Candidate.apk"
          sha256sum "${ARTIFACT_BASE}-Debug-Candidate.apk" | tee "${ARTIFACT_BASE}-Debug-Candidate.apk.sha256"

      - name: Upload CI candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}-Debug-Candidate
          path: |
            ${{ env.ARTIFACT_BASE }}-Debug-Candidate.apk
            ${{ env.ARTIFACT_BASE }}-Debug-Candidate.apk.sha256
          if-no-files-found: error
          retention-days: 30
