name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare offline web assets
        run: npm run prepare:web

      - name: Validate HTML and mobile shell
        run: |
          test -s www/mobile-modern.css
          test -s www/mobile-modern.js
          grep -q 'mobile-modern.css' www/index.html
          grep -q 'mobile-modern.js' www/index.html
          grep -q 'mobileBottomNav' www/mobile-modern.js
          grep -q 'mobileArchiveCards' www/mobile-modern.js
          grep -q 'mobileMeasureHero' www/mobile-modern.js
          grep -q 'vendor/chart/chart.umd.js' www/index.html
          grep -q 'vendor/fontawesome/css/all.min.css' www/index.html
          grep -q 'vendor/xlsx/xlsx.full.min.js' www/index.html
          if grep -qE 'cdnjs.cloudflare.com|cdn.jsdelivr.net/npm/chart.js|cdn.sheetjs.com/xlsx-' www/index.html; then
            echo "External runtime CDN reference found"
            exit 1
          fi
