name: Dependency Security Audit

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject tracked signing secrets
        run: npm run security:check

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
