name: UI Regression

on:
  # Required status checks must exist on the exact commit SHA. Do not path-skip
  # this workflow once mobile-ui is required by the protected-main ruleset.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare offline web app
        run: npm run prepare:web

      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory www >/tmp/bp-diary-ui-server.log 2>&1 &
          echo $! > /tmp/bp-diary-ui-server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bp-diary-ui-server.log
          exit 1

      - name: Run mobile UI regression
        run: npx playwright test tests/ui-v18.spec.mjs --reporter=line

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V18-Mobile-UI-Snapshots
          path: artifacts/ui-v18
          if-no-files-found: warn
          retention-days: 30
