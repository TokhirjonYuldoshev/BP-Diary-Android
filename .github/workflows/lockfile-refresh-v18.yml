name: V18 Lockfile Refresh

on:
  push:
    branches: [v18-secure-signing-migration]
    paths:
      - '.github/workflows/lockfile-refresh-v18.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V18 branch
        uses: actions/checkout@v4
        with:
          ref: v18-secure-signing-migration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh jsPDF dependency and lockfile
        run: npm install jspdf@4.2.1 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile target
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies.jspdf!=='4.2.1'||l.packages['node_modules/jspdf']?.version!=='4.2.1') process.exit(1); console.log('jsPDF lockfile target:',l.packages['node_modules/jspdf'].version)"
          git diff --check

      - name: Commit refreshed dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "No dependency changes generated"; exit 1; }
          git commit -m "deps(v18): upgrade jsPDF to 4.2.1"
          git push origin HEAD:v18-secure-signing-migration
