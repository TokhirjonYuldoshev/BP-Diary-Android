    function isValidRecord(rec) {
        if(!isPlainObject(rec)) return false;
        if(rec.id!==undefined && incomingSafeId(rec.id)===null) return false;
        if(rec.patientId!==undefined && incomingSafeId(rec.patientId)===null) return false;
        if(!isValidISODate(rec.date)) return false;
        if(!isValidTime(rec.time)) return false;
        if(!Array.isArray(rec.measures) || rec.measures.length!==3) return false;
        let hasBP=false;
        for(const m of rec.measures) {
            if(!isPlainObject(m)||!isPlainObject(m.left)||!isPlainObject(m.right)) return false;
            for(const side of ['left','right']) {
                const v=m[side];
                for(const k of ['sys','dia','pulse']) if(typeof v[k]!=='number' || !Number.isFinite(v[k])) return false;
                if(!validateBP(v.sys,v.dia,v.pulse)) return false;
                if(v.sys>0 && v.dia>0) hasBP=true;
            }
        }
        if(!hasBP) return false;
        for(const k of ['temperature','weight','height','age','cholTotal','cholHDL']) if(rec[k]!==undefined && (typeof rec[k]!=='number'||!Number.isFinite(rec[k]))) return false;
        if(rec.temperature!==undefined&&(rec.temperature<25||rec.temperature>45))return false; if(rec.weight!==undefined&&(rec.weight<1||rec.weight>500))return false; if(rec.height!==undefined&&(rec.height<30||rec.height>260))return false; if(rec.age!==undefined&&(rec.age<1||rec.age>120))return false; if(rec.cholTotal!==undefined&&(rec.cholTotal<0.1||rec.cholTotal>30))return false; if(rec.cholHDL!==undefined&&(rec.cholHDL<0.1||rec.cholHDL>10))return false; if(rec.cholTotal>0&&rec.cholHDL>0&&rec.cholHDL>=rec.cholTotal)return false;
        if(rec.gender!==undefined && !['male','female'].includes(rec.gender)) return false;
        if(rec.smoking!==undefined && !['0','1'].includes(String(rec.smoking))) return false;
        if(rec.diabetes!==undefined && !['0','1'].includes(String(rec.diabetes))) return false;
        if(rec.bpContext!==undefined && !['home','office'].includes(rec.bpContext)) return false;
        if(rec.emergencySymptoms!==undefined && typeof rec.emergencySymptoms!=='boolean') return false;
        if(rec.irregularPulseFlag!==undefined && typeof rec.irregularPulseFlag!=='boolean') return false;
        if(rec.timezoneOffsetMinutes!==undefined && (!Number.isFinite(rec.timezoneOffsetMinutes)||rec.timezoneOffsetMinutes < -840||rec.timezoneOffsetMinutes > 840)) return false;
        return true;
    }

        copy.emergencySymptoms=!!copy.emergencySymptoms;

        copy.bpContext=(copy.bpContext==='office')?'office':'home';

        return copy;
    }

    function profileValidationReason(id) {
        const el=document.getElementById(id); if(!el)return '';
        const raw=String(el.value??'').trim(),rule=PROFILE_NUMERIC_RULES[id];
        if(rule){
            if(raw==='') return rule.required ? tx('Поле обязательно.','This field is required.','Maydon majburiy.') : '';
            const value=safeParseFloat(raw);
            if(!Number.isFinite(value)) return tx('Введите число.','Enter a number.','Son kiriting.');
            if(rule.min!==undefined && value<rule.min) return tx('Допустимый диапазон: ','Allowed range: ','Ruxsat etilgan oraliq: ')+rule.range()+'.';
            if(rule.minExclusive!==undefined && value<=rule.minExclusive) return tx('Допустимый диапазон: ','Allowed range: ','Ruxsat etilgan oraliq: ')+rule.range()+'.';
            if(rule.max!==undefined && value>rule.max) return tx('Допустимый диапазон: ','Allowed range: ','Ruxsat etilgan oraliq: ')+rule.range()+'.';
        }
        const num=x=>safeParseFloat(document.getElementById(x)?.value);
        if(id==='cholHDL'){
            const h=num('cholHDL'),tc=num('cholTotal');
            if(Number.isFinite(h)&&Number.isFinite(tc)&&h>=tc) return tx('ЛПВП должен быть ниже общего холестерина.','HDL must be below total cholesterol.','HDL umumiy xolesterindan past bo‘lishi kerak.');
        }
        if(id==='diabetesAge' && document.getElementById('diabetes')?.value==='1'){
            const dm=num('diabetesAge'),age=num('age');

        }
        const minS=num('targetSysMinInput'),maxS=num('targetSysInput'),minD=num('targetDiaMinInput'),maxD=num('targetDiaInput');
        if((id==='targetSysMinInput'||id==='targetSysInput')&&Number.isFinite(minS)&&Number.isFinite(maxS)&&minS>=maxS) return tx('Минимальное САД должно быть ниже максимального.','Minimum SBP must be below maximum SBP.','Minimal SAB maksimal SAB dan past bo‘lishi kerak.');
        if((id==='targetDiaMinInput'||id==='targetDiaInput')&&Number.isFinite(minD)&&Number.isFinite(maxD)&&minD>=maxD) return tx('Минимальное ДАД должно быть ниже максимального.','Minimum DBP must be below maximum DBP.','Minimal DAB maksimal DAB dan past bo‘lishi kerak.');

            }
        }
        return '';

    function exportDoctorReport() {
        const filtered = getFilteredRecords();
        if (!filtered.length) { alert(t("noData")); return; }

        const sorted = filtered.slice().sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
        const sessionAvgs = sorted.map(r => ({r, a: computeGlobalAverage(r.measures)})).filter(x => x.a.sys>0 && x.a.dia>0);
        if (!sessionAvgs.length) { alert(t("noData")); return; }

        const avgSys = Math.round(sessionAvgs.reduce((s,x)=>s+x.a.sys,0) / sessionAvgs.length);
        const avgDia = Math.round(sessionAvgs.reduce((s,x)=>s+x.a.dia,0) / sessionAvgs.length);
        const sessionPulseVals = sessionAvgs.map(x=>x.a.pulse).filter(v=>v>0);
        const avgPulse = sessionPulseVals.length ? Math.round(sessionPulseVals.reduce((a,b)=>a+b,0)/sessionPulseVals.length) : 0;
        const pp = avgSys - avgDia;

        const readings = [];
        sorted.forEach((r,ri) => {
            (r.measures||[]).forEach((m,mi) => ['left','right'].forEach(side => {
                const v = m?.[side];
                if (v?.sys>0 && v?.dia>0) readings.push({
                    sys:Number(v.sys), dia:Number(v.dia), pulse:Number(v.pulse)||0,
                    recordIndex:ri, recordId:safeRecordId(r.id), date:r.date, time:r.time,
                    measurement:mi+1, side
                });
            }));
        });
